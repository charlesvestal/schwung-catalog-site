name: Update catalog and download counts

on:
  schedule:
    - cron: '0 * * * *'  # Hourly
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch module catalog
        run: |
          curl -sSfL \
            "https://raw.githubusercontent.com/charlesvestal/schwung/main/module-catalog.json" \
            -o data/module-catalog.json

      - name: Resolve release repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A module's releases do not always live in its catalog github_repo.
          # That repo is where the manager reads release.json, and
          # release.json's download_url is what it actually installs -- the
          # Work family keeps one release.json per module repo but ships all
          # four tarballs from timncox/schwung-work, so counting github_repo
          # found no releases at all: 0 downloads and first_release
          # "unknown", which sorted to the TOP of Newest.
          #
          # Output: id, release repo, asset name, shared (1 when another
          # catalog module resolves to the same repo).
          : > release-repos.raw
          jq -r '.modules[] | "\(.id)\t\(.github_repo)\t\(.default_branch // "main")\t\(.asset_name // "")"' \
            data/module-catalog.json |
          while IFS="$(printf '\t')" read -r id repo branch asset; do
            [ -z "$repo" ] && continue
            url=$(gh api "repos/${repo}/contents/release.json?ref=${branch}" --jq .content 2>/dev/null \
              | base64 -d 2>/dev/null \
              | jq -r --arg id "$id" '.modules[$id].download_url // .download_url // empty' 2>/dev/null)
            rel=$(printf '%s' "$url" | sed -nE 's#^https://github\.com/([^/]+/[^/]+)/releases/download/.*#\1#p')
            [ -z "$rel" ] && rel="$repo"
            [ -z "$asset" ] && [ -n "$url" ] && asset="${url##*/}"
            printf '%s\t%s\t%s\n' "$id" "$rel" "$asset" >> release-repos.raw
          done
          # GitHub repo names are case-insensitive; compare them that way.
          awk -F'\t' 'NR==FNR { n[tolower($2)]++; next }
                      { print $0 "\t" (n[tolower($2)] > 1 ? 1 : 0) }' \
            release-repos.raw release-repos.raw > release-repos.tsv
          awk -F'\t' '$4 == 1' release-repos.tsv

      - name: Fetch download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A repo that ships ONE catalog module counts every asset, as it
          # always has. A SHARED repo counts only this module's own tarball:
          # summing the repo gave Smack, Smack In and Oversmack the same
          # number, the whole repo's.
          echo '{}' > data/download-counts.json
          while IFS="$(printf '\t')" read -r id repo asset shared; do
            if [ "$shared" = 1 ]; then
              filter="[.[].assets[] | select(.name == \"${asset}\") | .download_count] | add // 0"
            else
              filter='[.[].assets[].download_count] | add // 0'
            fi
            count=$(gh api "repos/${repo}/releases" --paginate --jq '.[]' 2>/dev/null \
              | jq -s "$filter" 2>/dev/null)
            [ -z "$count" ] && count=0
            jq --arg id "$id" --argjson n "$count" '.[$id] = $n' data/download-counts.json > counts.tmp
            mv counts.tmp data/download-counts.json
          done < release-repos.tsv

          # Downloads GitHub no longer reports. Deleting a release deletes its
          # download counts with it, so an author who re-cuts every release
          # would restart from zero. Each offset is the module's last total
          # before its old releases were deleted, added on top of what
          # GitHub reports now.
          if [ -f data/download-counts-offsets.json ]; then
            jq --slurpfile off data/download-counts-offsets.json '
              with_entries(.value += ($off[0][.key] // 0))
            ' data/download-counts.json > counts.tmp
            mv counts.tmp data/download-counts.json
          fi

          # Validate JSON
          jq . data/download-counts.json > /dev/null

      - name: Migrate count history to per-module attribution (once)
        run: |
          # The history was recorded under the old attribution (repo-wide
          # sums, or 0 for a module whose releases live elsewhere). Windows
          # are current minus a baseline, so a baseline on the old scale
          # reads as 0 for a month (shared repos) or as the whole lifetime
          # in one week (the Work trio). Rescale each affected module's
          # history to the new scale once: by new/old at the latest
          # snapshot, or flat at the new count when the old was 0.
          MARKER=data/download-counts-history.v2
          HISTORY_FILE=data/download-counts-history.json
          [ -f "$MARKER" ] && exit 0
          [ -f "$HISTORY_FILE" ] || { touch "$MARKER"; exit 0; }
          shared=$(awk -F'\t' '$4 == 1 { print $1 }' release-repos.tsv | jq -R . | jq -s .)
          jq --slurpfile cur data/download-counts.json --argjson shared "$shared" '
            (keys | max) as $last
            | .[$last] as $old
            | (reduce ($cur[0] | to_entries[]) as $e ({};
                ($old[$e.key] // 0) as $o
                | if ($shared | index($e.key)) != null or ($o == 0 and $e.value > 0)
                  then .[$e.key] = {o: $o, n: $e.value} else . end)) as $chg
            | map_values(
                with_entries(
                  if $chg[.key] == null then .
                  elif $chg[.key].o == 0 then .value = $chg[.key].n
                  else .value = ((.value * $chg[.key].n / $chg[.key].o) | floor)
                  end))
          ' "$HISTORY_FILE" > history.tmp
          mv history.tmp "$HISTORY_FILE"
          touch "$MARKER"

      - name: Fetch release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The four original fields keep their exact shape. app.js does
          # `new Date(meta.last_updated + 'T00:00:00Z')` and .sort()s
          # release_dates as bare strings, so those stay day-truncated,
          # and `version` stays "newest release, whatever it is" -- an
          # older Schwung Manager reads that field and filtering it would
          # silently downgrade what every existing install is offered.
          #
          # Everything new goes in NEW keys. Go's encoding/json drops
          # unknown fields, so older managers ignore them entirely.
          #
          #   releases  full published_at timestamps. The manager needs
          #             to order two releases cut on the SAME DAY, and
          #             the ties are real: davebox shipped v1.0b and
          #             v1.0b2 nine hours apart, and beta.7 / beta.8
          #             fourteen. Day strings tie on exactly the
          #             comparisons that matter.
          #   channels  newest stable / newest prerelease, keyed on
          #             GitHub's prerelease FLAG and never on the tag
          #             NAME. Reading the name treats davebox's
          #             v1.0-beta.8 as a prerelease and hands its stable
          #             channel to v1.0b4 -- a module whose author has
          #             simply never cut a 1.0. The flag is what an
          #             author opts into; absent it, nothing changes.
          #             Emitted only when a repo has BOTH, which is the
          #             only case the channel feature is about.
          #
          # --paginate: the un-paginated call caps at 30 releases, which
          # silently truncated the three longest histories and left their
          # first_release wrong. A complete list is also what lets the
          # manager date an OLD installed version rather than only a
          # recent one.

          # Copied BEFORE the reset below, or the floor reads an empty file.
          cp data/release-metadata.json prev-metadata.json 2>/dev/null || echo '{}' > prev-metadata.json

          echo '{}' > data/release-metadata.json

          # Previous run's metadata: a first_release only ever moves EARLIER.
          # An author who deletes and re-cuts every release (9W9, 6W6, 8W8
          # and CW-78 on 2026-10-27) otherwise turns a two-month-old module
          # into the newest one in the catalog.

          while IFS="$(printf '\t')" read -r id repo asset shared; do
            # In a shared repo, only the releases that carry this module's
            # tarball are this module's releases.
            if [ "$shared" = 1 ]; then
              sel="select(any(.assets[]; .name == \"${asset}\"))"
            else
              sel='.'
            fi
            releases=$(gh api "repos/${repo}/releases" --paginate \
              --jq ".[] | ${sel} | {tag: .tag_name, published_at: .published_at, prerelease: .prerelease}" \
              2>/dev/null | jq -s '.' 2>/dev/null)
            [ -z "$releases" ] && releases='[]'
            prev_first=$(jq -r --arg id "$id" '.[$id].first_release // "unknown"' prev-metadata.json)

            jq --arg id "$id" --arg prev "$prev_first" --argjson rel "$releases" '
              ($rel | map(select(.published_at != null)) | sort_by(.published_at)) as $r
              | ($r | map(select(.prerelease | not))) as $stable
              | ($r | map(select(.prerelease)))       as $beta
              | .[$id] = (
                  {
                    first_release: ([(if ($r|length) > 0 then $r[0].published_at[:10] else empty end),
                                     ($prev | select(. != "unknown"))] | min // "unknown"),
                    last_updated:  (if ($r|length) > 0 then $r[-1].published_at[:10] else "unknown" end),
                    version:       (if ($r|length) > 0 then $r[-1].tag               else "unknown" end),
                    release_dates: ($r | map(.published_at[:10])),
                    releases:      $r
                  }
                  + (if ($stable|length) > 0 and ($beta|length) > 0 then
                       {channels: {stable: {version: $stable[-1].tag},
                                   beta:   {version: $beta[-1].tag}}}
                     else {} end)
                )
            ' data/release-metadata.json > data/release-metadata.tmp
            mv data/release-metadata.tmp data/release-metadata.json
          done < release-repos.tsv

          jq . data/release-metadata.json > /dev/null

      - name: Fetch installer release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(gh api "repos/charlesvestal/schwung-installer/releases/latest" 2>/dev/null || echo "{}")
          version=$(echo "$release" | jq -r '.tag_name // empty')
          html_url=$(echo "$release" | jq -r '.html_url // empty')
          published_at=$(echo "$release" | jq -r '.published_at // empty' | cut -c1-10)

          # Per-platform / per-arch asset URLs (substring match on asset names)
          mac_arm64_url=$(echo "$release" | jq -r '[.assets[]? | select(.name | test("mac-arm64"))] | .[0].browser_download_url // empty')
          mac_x64_url=$(echo "$release" | jq -r '[.assets[]? | select(.name | test("mac-x64"))] | .[0].browser_download_url // empty')
          win_x64_url=$(echo "$release" | jq -r '[.assets[]? | select(.name | test("win-x64"))] | .[0].browser_download_url // empty')
          win_arm64_url=$(echo "$release" | jq -r '[.assets[]? | select(.name | test("win-arm64"))] | .[0].browser_download_url // empty')
          linux_amd64_url=$(echo "$release" | jq -r '[.assets[]? | select(.name | test("linux-amd64"))] | .[0].browser_download_url // empty')
          linux_arm64_url=$(echo "$release" | jq -r '[.assets[]? | select(.name | test("linux-arm64"))] | .[0].browser_download_url // empty')

          if [ -z "$version" ]; then
            version="unknown"
            html_url="https://github.com/charlesvestal/schwung-installer/releases/latest"
          fi

          jq -n \
            --arg version "$version" \
            --arg html_url "$html_url" \
            --arg published_at "$published_at" \
            --arg mac_arm64_url "$mac_arm64_url" \
            --arg mac_x64_url "$mac_x64_url" \
            --arg win_x64_url "$win_x64_url" \
            --arg win_arm64_url "$win_arm64_url" \
            --arg linux_amd64_url "$linux_amd64_url" \
            --arg linux_arm64_url "$linux_arm64_url" \
            '{version: $version, html_url: $html_url, published_at: $published_at, mac_arm64_url: $mac_arm64_url, mac_x64_url: $mac_x64_url, win_x64_url: $win_x64_url, win_arm64_url: $win_arm64_url, linux_amd64_url: $linux_amd64_url, linux_arm64_url: $linux_arm64_url}' \
            > data/installer-release.json

          jq . data/installer-release.json > /dev/null

      - name: Fetch Schwung host release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(gh api "repos/charlesvestal/schwung/releases/latest" 2>/dev/null || echo "{}")
          version=$(echo "$release" | jq -r '.tag_name // empty')
          html_url=$(echo "$release" | jq -r '.html_url // empty')
          published_at=$(echo "$release" | jq -r '.published_at // empty' | cut -c1-10)

          if [ -z "$version" ]; then
            version="unknown"
            html_url="https://github.com/charlesvestal/schwung/releases/latest"
          fi

          jq -n \
            --arg version "$version" \
            --arg html_url "$html_url" \
            --arg published_at "$published_at" \
            '{version: $version, html_url: $html_url, published_at: $published_at}' \
            > data/schwung-release.json

          jq . data/schwung-release.json > /dev/null

      - name: Update download count history
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          HISTORY_FILE=data/download-counts-history.json

          # Initialize history if missing
          if [ ! -f "$HISTORY_FILE" ] || ! jq . "$HISTORY_FILE" > /dev/null 2>&1; then
            echo '{}' > "$HISTORY_FILE"
          fi

          # Add today's counts to history
          jq --arg date "$TODAY" --slurpfile counts data/download-counts.json \
            '. + {($date): $counts[0]}' "$HISTORY_FILE" > tmp-history.json

          # Prune entries older than 35 days (supports 30-day lookback)
          CUTOFF=$(date -u -d "35 days ago" +%Y-%m-%d 2>/dev/null || date -u -v-35d +%Y-%m-%d)
          jq --arg cutoff "$CUTOFF" 'to_entries | map(select(.key >= $cutoff)) | from_entries' \
            tmp-history.json > "$HISTORY_FILE"
          rm tmp-history.json

      - name: Fetch module preview audio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pulls a `preview.mp3` or `preview.m4a` asset from each module's
          # latest GitHub release into audio/<id>.<ext>. Only fetches when
          # no local file exists (in either format), so manually-committed
          # previews are sticky and authors can fill gaps by attaching
          # preview.mp3 / preview.m4a to their releases.
          mkdir -p audio
          while IFS="$(printf '\t')" read -r id repo asset shared; do
            [ -f "audio/${id}.mp3" ] && continue
            [ -f "audio/${id}.m4a" ] && continue
            for ext in m4a mp3; do
              url=$(gh api "repos/${repo}/releases/latest" \
                --jq ".assets[]? | select(.name == \"preview.${ext}\") | .browser_download_url" \
                2>/dev/null | head -1)
              [ -z "$url" ] && continue
              echo "Fetching preview.${ext} for ${id} from ${repo}"
              curl -sSfL -o "audio/${id}.${ext}" "$url" || { rm -f "audio/${id}.${ext}"; continue; }
              break
            done
          done < release-repos.tsv

      - name: Fetch demos playlist
        env:
          PLAYLIST_ID: PLlG7OuetKX9kqpqwetSw0lXWhJM2IP39f
        run: |
          # Use yt-dlp to scrape playlist metadata — no API key required.
          # --flat-playlist returns just IDs/titles per entry; we synthesize
          # thumbnail URLs from the standard YouTube CDN path.
          python3 -m pip install --quiet --upgrade yt-dlp || { echo "yt-dlp install failed"; exit 0; }

          raw=$(mktemp)
          if ! yt-dlp --flat-playlist --dump-single-json \
                "https://www.youtube.com/playlist?list=${PLAYLIST_ID}" > "$raw"; then
            echo "yt-dlp failed; leaving data/demos.json unchanged."
            rm -f "$raw"
            exit 0
          fi

          jq --arg pid "$PLAYLIST_ID" \
             --arg upd "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              playlist_id: $pid,
              updated_at: $upd,
              videos: [ .entries
                | to_entries[]
                | select(.value.id != null)
                | select((.value.title // "") | test("^\\[?(Deleted|Private) video\\]?$") | not)
                | {
                    id: .value.id,
                    title: .value.title,
                    publishedAt: null,
                    position: .key,
                    thumbnail: ("https://i.ytimg.com/vi/" + .value.id + "/hqdefault.jpg")
                  } ]
            }' "$raw" > data/demos.json

          rm -f "$raw"
          jq . data/demos.json > /dev/null

      - name: Build audio preview list
        run: |
          # Map each module id to the extension of its preview file (mp3 or m4a)
          echo -n 'window.AUDIO_PREVIEWS = {' > data/audio-previews.js
          first=true
          for f in audio/*.mp3 audio/*.m4a; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            id="${base%.*}"
            if [ "$first" = true ]; then
              first=false
            else
              echo -n ',' >> data/audio-previews.js
            fi
            printf '"%s":"%s"' "$id" "$ext" >> data/audio-previews.js
          done
          echo '};' >> data/audio-previews.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update catalog and download counts"
          git push
